    "0603": { p_rated: { value: 0.1, unit: W, source: "generic thick-film 0603 1/10 W (verify)" }, t_knee: { value: 70, unit: degC, source: "typical derating knee (verify)" } }
    "0805": { p_rated: { value: 0.125, unit: W, source: "generic thick-film 0805 1/8 W (verify)" }, t_knee: { value: 70, unit: degC, source: "typical derating knee (verify)" } }
    "1206": { p_rated: { value: 0.25, unit: W, source: "generic thick-film 1206 1/4 W (verify)" }, t_knee: { value: 70, unit: degC, source: "typical derating knee (verify)" } }
    "2010": { p_rated: { value: 0.75, unit: W, source: "generic thick-film 2010 3/4 W (verify)" }, t_knee: { value: 70, unit: degC, source: "typical derating knee (verify)" } }
