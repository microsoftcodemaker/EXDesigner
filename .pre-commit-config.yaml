repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ui-tokens
        name: no hard-coded colors in dfr/ui
        entry: python scripts/check_ui_tokens.py
        language: system
        pass_filenames: false
        files: ^dfr/ui/
